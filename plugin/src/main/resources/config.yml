# 監視かつリセット対象のワールド名。
# 空にすると「主ワールド (server.properties の level-name) と、
# その _nether / _the_end」が自動的に対象になる。
worlds: []

# 死亡してから全員をキックするまでの猶予 (秒)。この間ずっとタイトルが出る。
reset-delay-seconds: 10

# 猶予中に全員へ出すタイトル (MiniMessage 形式)。
# <player> は死亡者名、<seconds> は上の reset-delay-seconds に置き換わる。
# 空文字にするとタイトルを出さない。
title: "<red><bold>サーバーは<seconds>秒後に削除されます"

# タイトルの下に出る小さい方 (MiniMessage 形式)。空文字で無効。
subtitle: "<gray><player> が死亡しました"

# 猶予の開始と同時に流すチャット (MiniMessage 形式)。空文字で無効。
# 死亡メッセージはタイトルに置き換えるため、既定では出さない。
broadcast-message: ""

# 猶予が終わったときのキック理由 (MiniMessage 形式)。
kick-message: |-
  <red><bold>ハードコア失敗</bold></red>
  <white><player> が死亡しました。</white>
  <gray>ワールドをリセットして再起動します。</gray>

# 全員をキックしてからサーバーを停止するまでの待ち時間 (tick, 20 tick = 1 秒)。
# 切断パケットを送り切るために 1 tick 以上を推奨。
shutdown-delay-ticks: 20

# shutdown: サーバーを停止する (外部のプロセス管理で再起動させる)
# restart : Spigot の restart-script を使って再起動する
shutdown-mode: shutdown

# リセット時に server.properties の level-seed を新しい乱数へ書き換える。
# false の場合、level-seed が固定されていると毎回まったく同じ地形が再生成される。
randomize-seed: true

# ワールドリセットを Discord の Webhook へ Embed で流す。
discord:
  # false にすると一切送らない。
  enabled: true

  # 送り先の Webhook URL。空 (既定) の間は通知しない。
  # Webhook URL は事実上の認証情報 = 知っていれば誰でもそのチャンネルへ投稿できるので、
  # ここへ書いた値をリポジトリへコミットしないこと。設定するのは各サーバーの
  # plugins/WorldIsAlsoHardcore/config.yml だけにする。
  webhook-url: ""

  # Webhook の表示名を上書きする。空なら Discord 側の設定のまま。
  username: ""

  # Embed の題と色 (10進数)。既定は 0xE74C3C = 15158332 の赤。
  embed-title: "ワールドがリセットされました"
  embed-color: 15158332

  # Embed の下端に出す小さい文字。空文字で無効。
  footer: ""

  # サムネイルに出す頭 (HeadFace) の画像。<uuid> と <player> が置き換わる。
  # スキンの描画は外部のアバターサービスに任せている。空文字にすると頭を出さない。
  # 例: https://crafatar.com/avatars/<uuid>?size=128&overlay
  head-image-url: "https://mc-heads.net/avatar/<uuid>/128"

  # 1回の送信で待つ時間 (秒)。
  timeout-seconds: 5

  # サーバー停止時に送信の終了を待つ時間 (秒)。
  # ここで待たないとリセットの通知そのものを送り切れずに落ちる。
  # 待てなかった通知は保留され、次回起動時に送り直す。
  flush-timeout-seconds: 8
